<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#22C55E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KazaJob" />
  <meta name="description" content="Plateforme de placement rapide sécurisé — Libreville, Gabon" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>KazaJob</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%; width: 100%; overflow: hidden;
      font-family: 'DM Sans', 'Nunito', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      background: #F7F6F3;
    }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    input, textarea, button { font-family: inherit; }
    input:focus, textarea:focus { outline: none; border-color: #22C55E !important; }
    ::-webkit-scrollbar { width: 0; background: transparent; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #22C55E, #15803D);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash h1 { font-size: 42px; font-weight: 800; color: #fff; letter-spacing: -1px; }
    #splash p { color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 8px; font-weight: 500; }
    .splash-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.6); margin: 0 4px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .splash-dot:nth-child(2) { animation-delay: 0.2s; }
    .splash-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
    .install-banner {
      position: fixed; bottom: 80px; left: 16px; right: 16px; z-index: 100;
      background: #fff; border-radius: 20px; padding: 16px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 14;
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .syncing-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #22C55E, #3B82F6, #22C55E); background-size: 200%; animation: shimmer 1.5s infinite; z-index: 9998; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>
<div id="splash">
  <h1><span>Kaza</span><span style="color:#bbf7d0">Job</span></h1>
  <p>Placement rapide sécurisé</p>
  <div style="margin-top:24px">
    <span class="splash-dot"></span><span class="splash-dot"></span><span class="splash-dot"></span>
  </div>
</div>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
// ====== PWA ======
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; window.dispatchEvent(new Event('kazajob-installable')); });
setTimeout(() => { const s = document.getElementById('splash'); if(s){s.classList.add('hide');setTimeout(()=>s.remove(),500);} }, 1400);

// ====== REACT ======
const { useState, useEffect, useRef, useCallback, createContext, useContext, createElement: h, Fragment } = React;

// ====== SUPABASE ======
const SB = window.supabase.createClient(
  'https://gzkzchoiakjignvygtxb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6a3pjaG9pYWtqaWdudnlndHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTY5NjQsImV4cCI6MjA5MDYzMjk2NH0.xyLMsZkGHYB6sPUWdXd8oF0v_HIkDJOEjlDTQHjmqrs'
);

// ====== MAPPERS snake_case → camelCase ======
const mapE = r => r ? ({ id:r.id, companyName:r.company_name, rccm:r.rccm, sector:r.sector, zone:r.zone, phone:r.phone, avgRating:r.avg_rating||0, ratingsCount:r.ratings_count||0, status:r.status, createdAt:r.created_at }) : null;
const mapW = r => r ? ({ id:r.id, fullName:r.full_name, phone:r.phone, neighborhood:r.neighborhood, skills:r.skills||[], avgRating:r.avg_rating||0, ratingsCount:r.ratings_count||0, missionsDone:r.missions_done||0, createdAt:r.created_at }) : null;
const mapM = r => r ? ({ id:r.id, employerId:r.employer_id, employerName:r.employer_name, employerRating:r.employer_rating||0, title:r.title, category:r.category, location:r.location, dateTime:r.date_time, duration:r.duration, tasks:r.tasks, payFcfa:r.pay_fcfa, riskLevel:r.risk_level, responsible:r.responsible, responsiblePhone:r.responsible_phone, equipProvided:r.equip_provided||[], equipBring:r.equip_bring||[], status:r.status, selectedWorkerId:r.selected_worker_id, publishedAt:r.published_at, startedAt:r.started_at, completedAt:r.completed_at }) : null;
const mapA = r => r ? ({ id:r.id, missionId:r.mission_id, workerId:r.worker_id, workerName:r.worker_name, workerSkills:r.worker_skills||[], workerRating:r.worker_rating||0, workerMissions:r.worker_missions||0, status:r.status, appliedAt:r.applied_at, selectedAt:r.selected_at }) : null;
const mapP = r => r ? ({ id:r.id, missionId:r.mission_id, employerId:r.employer_id, workerId:r.worker_id, amountFcfa:r.amount_fcfa, commissionFcfa:r.commission_fcfa, status:r.status, preauthAt:r.preauth_at, releasedAt:r.released_at }) : null;
const mapR = r => r ? ({ id:r.id, missionId:r.mission_id, fromUser:r.from_user, toUser:r.to_user, fromRole:r.from_role, toRole:r.to_role, moodScore:r.mood_score, conditionsMet:r.conditions_met, createdAt:r.created_at }) : null;
const mapI = r => r ? ({ id:r.id, missionId:r.mission_id, reportedBy:r.reported_by, incidentType:r.incident_type, description:r.description, status:r.status, resolution:r.resolution, resolvedAt:r.resolved_at, createdAt:r.created_at }) : null;

function genCode() { return String(Math.floor(1000+Math.random()*9000)); }
function saveSession(k,v) { try { localStorage.setItem('kj_'+k, v?JSON.stringify({id:v.id}):''); } catch{} }
function loadSession(k) { try { const s=localStorage.getItem('kj_'+k); return s?JSON.parse(s):null; } catch{return null;} }

// ====== STATE ======
const AppContext = createContext();

function useAppState() {
  const [state, setState] = useState({
    employers:[], workers:[], missions:[], applications:[],
    missionCodes:{}, payments:[], ratings:[], incidents:[],
    currentEmployer:null, currentWorker:null, loading:true, syncing:false, error:null
  });

  const loadAll = useCallback(async () => {
    setState(p=>({...p, loading:true}));
    try {
      const [
        {data:employers},{data:workers},{data:missions},{data:applications},
        {data:payments},{data:ratings},{data:incidents},{data:codes},{data:vals}
      ] = await Promise.all([
        SB.from('employers').select('*'),
        SB.from('workers').select('*'),
        SB.from('missions').select('*').order('published_at',{ascending:false}),
        SB.from('applications').select('*'),
        SB.from('payments').select('*'),
        SB.from('ratings').select('*'),
        SB.from('incidents').select('*'),
        SB.from('mission_codes').select('*'),
        SB.from('mission_code_validations').select('*'),
      ]);
      const codesMap = {};
      (codes||[]).forEach(c => { codesMap[c.mission_id]={codeStart:c.code_start,codeEnd:c.code_end,workers:{}}; });
      (vals||[]).forEach(v => { if(codesMap[v.mission_id]) codesMap[v.mission_id].workers[v.worker_id]={startValidated:v.start_validated,startTime:v.start_time,endValidated:v.end_validated,endTime:v.end_time}; });
      const mappedE=(employers||[]).map(mapE), mappedW=(workers||[]).map(mapW);
      const eS=loadSession('employer'), wS=loadSession('worker');
      setState(p=>({...p,
        employers:mappedE, workers:mappedW,
        missions:(missions||[]).map(mapM), applications:(applications||[]).map(mapA),
        payments:(payments||[]).map(mapP), ratings:(ratings||[]).map(mapR),
        incidents:(incidents||[]).map(mapI), missionCodes:codesMap,
        currentEmployer:eS?mappedE.find(e=>e.id===eS.id)||null:null,
        currentWorker:wS?mappedW.find(w=>w.id===wS.id)||null:null,
        loading:false, error:null
      }));
    } catch(e) { setState(p=>({...p,loading:false,error:'Erreur de connexion'})); }
  }, []);

  useEffect(()=>{ loadAll(); }, []);

  // Realtime
  useEffect(()=>{
    const ch = SB.channel('kj-rt').on('postgres_changes',{event:'*',schema:'public'},()=>loadAll()).subscribe();
    return ()=>SB.removeChannel(ch);
  },[loadAll]);

  const dispatch = useCallback(async (action) => {
    setState(p=>({...p,syncing:true,error:null}));
    try {
      const st = action.__state;
      const emp = action.__emp;
      const wkr = action.__wkr;
      switch(action.type) {

        case 'REGISTER_EMPLOYER': {
          const {data,error} = await SB.from('employers').insert([{
            company_name:action.payload.companyName, rccm:action.payload.rccm,
            sector:action.payload.sector, zone:action.payload.zone, phone:action.payload.phone
          }]).select().single();
          if(error) throw error;
          const e=mapE(data);
          // Créer le profil lié à l'auth user si OAuth
          if(action.authUserId){
            await SB.from('profiles').upsert([{id:action.authUserId,role:'employer',entity_id:e.id}]);
          }
          saveSession('employer',e); saveSession('worker',null);
          setState(p=>({...p,employers:[...p.employers,e],currentEmployer:e,currentWorker:null}));
          break;
        }

        case 'REGISTER_WORKER': {
          const {data,error} = await SB.from('workers').insert([{
            full_name:action.payload.fullName, phone:action.payload.phone,
            neighborhood:action.payload.neighborhood, skills:action.payload.skills||[]
          }]).select().single();
          if(error) throw error;
          const w=mapW(data);
          // Créer le profil lié à l'auth user si OAuth
          if(action.authUserId){
            await SB.from('profiles').upsert([{id:action.authUserId,role:'worker',entity_id:w.id}]);
          }
          saveSession('worker',w); saveSession('employer',null);
          setState(p=>({...p,workers:[...p.workers,w],currentWorker:w,currentEmployer:null}));
          break;
        }

        case 'SET_EMPLOYER':
          saveSession('employer',action.payload); saveSession('worker',null);
          setState(p=>({...p,currentEmployer:action.payload,currentWorker:null}));
          break;

        case 'SET_WORKER':
          saveSession('worker',action.payload); saveSession('employer',null);
          setState(p=>({...p,currentWorker:action.payload,currentEmployer:null}));
          break;

        case 'PUBLISH_MISSION': {
          const cs=genCode(), ce=genCode();
          const {data:m,error} = await SB.from('missions').insert([{
            employer_id:emp.id, employer_name:emp.companyName, employer_rating:emp.avgRating||0,
            title:action.payload.title, category:action.payload.category, location:action.payload.location,
            date_time:action.payload.dateTime, duration:action.payload.duration, tasks:action.payload.tasks,
            pay_fcfa:parseInt(action.payload.payFcfa), risk_level:action.payload.riskLevel,
            responsible:action.payload.responsible, responsible_phone:action.payload.responsiblePhone,
            equip_provided:action.payload.equipProvided||[], equip_bring:action.payload.equipBring||[], status:'published'
          }]).select().single();
          if(error) throw error;
          await SB.from('mission_codes').insert([{mission_id:m.id,code_start:cs,code_end:ce}]);
          await SB.from('event_log').insert([{mission_id:m.id,type:'mission_published',payload:{title:m.title}}]);
          break;
        }

        case 'APPLY_MISSION': {
          const {error} = await SB.from('applications').insert([{
            mission_id:action.payload.missionId, worker_id:wkr.id,
            worker_name:wkr.fullName, worker_skills:wkr.skills||[],
            worker_rating:wkr.avgRating||0, worker_missions:wkr.missionsDone||0, status:'pending'
          }]);
          if(error) throw error;
          await SB.from('event_log').insert([{mission_id:action.payload.missionId,type:'application_submitted',payload:{workerName:wkr.fullName}}]);
          break;
        }

        case 'SELECT_WORKER': {
          const {applicationId,missionId,workerId} = action.payload;
          const mission = st.missions.find(m=>m.id===missionId);
          await SB.from('applications').update({status:'selected',selected_at:new Date().toISOString()}).eq('id',applicationId);
          await SB.from('applications').update({status:'rejected'}).eq('mission_id',missionId).neq('id',applicationId);
          await SB.from('missions').update({status:'worker_selected',selected_worker_id:workerId}).eq('id',missionId);
          await SB.from('mission_code_validations').upsert([{mission_id:missionId,worker_id:workerId,start_validated:false,end_validated:false}]);
          const amt=parseInt(mission?.payFcfa||0);
          await SB.from('payments').insert([{mission_id:missionId,employer_id:emp.id,worker_id:workerId,amount_fcfa:amt,commission_fcfa:Math.round(amt*0.15),status:'preauthorized'}]);
          await SB.from('event_log').insert([{mission_id:missionId,type:'worker_selected',payload:{workerId}}]);
          break;
        }

        case 'VALIDATE_CODE_START': {
          const {missionId,workerId,code} = action.payload;
          const codes = st.missionCodes[missionId];
          if(!codes||code!==codes.codeStart) { setState(p=>({...p,syncing:false})); return {error:'Code incorrect'}; }
          const now=new Date().toISOString();
          await SB.from('mission_code_validations').update({start_validated:true,start_time:now}).eq('mission_id',missionId).eq('worker_id',workerId);
          await SB.from('missions').update({status:'in_progress',started_at:now}).eq('id',missionId);
          await SB.from('event_log').insert([{mission_id:missionId,type:'code_start_validated',payload:{workerId,time:now}}]);
          break;
        }

        case 'VALIDATE_CODE_END': {
          const {missionId,workerId,code} = action.payload;
          const codes = st.missionCodes[missionId];
          if(!codes||code!==codes.codeEnd) { setState(p=>({...p,syncing:false})); return {error:'Code incorrect'}; }
          const now=new Date().toISOString();
          await SB.from('mission_code_validations').update({end_validated:true,end_time:now}).eq('mission_id',missionId).eq('worker_id',workerId);
          await SB.from('missions').update({status:'completed',completed_at:now}).eq('id',missionId);
          const hasIncident=st.incidents.some(i=>i.missionId===missionId&&i.status==='open');
          if(!hasIncident) await SB.from('payments').update({status:'released',released_at:now}).eq('mission_id',missionId);
          await SB.from('workers').update({missions_done:(wkr.missionsDone||0)+1}).eq('id',workerId);
          await SB.from('event_log').insert([{mission_id:missionId,type:'mission_completed',payload:{workerId}}]);
          break;
        }

        case 'SUBMIT_RATING': {
          const {missionId,fromUser,toUser,fromRole,toRole,moodScore,conditionsMet} = action.payload;
          await SB.from('ratings').insert([{mission_id:missionId,from_user:fromUser,to_user:toUser,from_role:fromRole,to_role:toRole,mood_score:moodScore,conditions_met:conditionsMet}]);
          const {data:all} = await SB.from('ratings').select('mood_score').eq('to_user',toUser).eq('to_role',toRole);
          if(all&&all.length){
            const avg=Math.round((all.reduce((s,r)=>s+r.mood_score,0)/all.length)*10)/10;
            if(toRole==='employer') await SB.from('employers').update({avg_rating:avg,ratings_count:all.length}).eq('id',toUser);
            else await SB.from('workers').update({avg_rating:avg,ratings_count:all.length}).eq('id',toUser);
          }
          break;
        }

        case 'REPORT_INCIDENT': {
          const {missionId,reportedBy,incidentType,description} = action.payload;
          await SB.from('incidents').insert([{mission_id:missionId,reported_by:reportedBy,incident_type:incidentType,description,status:'open'}]);
          await SB.from('payments').update({status:'blocked'}).eq('mission_id',missionId);
          await SB.from('event_log').insert([{mission_id:missionId,type:'incident_reported',payload:{type:incidentType}}]);
          break;
        }

        case 'RESOLVE_INCIDENT': {
          const {incidentId,resolution,paymentAction} = action.payload;
          const now=new Date().toISOString();
          const inc=st.incidents.find(i=>i.id===incidentId);
          await SB.from('incidents').update({status:'resolved',resolution,resolved_at:now}).eq('id',incidentId);
          if(inc){
            if(paymentAction==='release') await SB.from('payments').update({status:'released',released_at:now}).eq('mission_id',inc.missionId);
            else if(paymentAction==='cancel') await SB.from('payments').update({status:'cancelled'}).eq('mission_id',inc.missionId);
          }
          break;
        }

        default: break;
      }
    } catch(e) { setState(p=>({...p,error:'Erreur : '+(e.message||'')})); }
    setState(p=>({...p,syncing:false}));
    loadAll();
  }, [loadAll]);

  // Wrapper qui injecte le state courant
  const wrappedDispatch = useCallback((action) => {
    let st, emp, wkr;
    setState(p => { st=p; emp=p.currentEmployer; wkr=p.currentWorker; return p; });
    return dispatch({...action, __state:st, __emp:emp, __wkr:wkr});
  }, [dispatch]);

  return { state, dispatch: wrappedDispatch };
}

// ====== DESIGN ======
const C = { bg:"#F7F6F3",white:"#FFFFFF",green:"#22C55E",greenDark:"#15803D",greenLight:"#F0FDF4",blue:"#3B82F6",blueDark:"#1D4ED8",blueLight:"#EFF6FF",orange:"#F59E0B",orangeLight:"#FFF7ED",red:"#EF4444",redLight:"#FEF2F2",text:"#2D2D2D",textSec:"#8C8C8C",textTri:"#B5B5B5",border:"#ECECEC" };
const CATEGORIES = ["Manutention","Logistique","Inventaire","\u00C9v\u00E9nementiel","H\u00F4tellerie","Accueil"];
const CAT_EMOJIS = {"Manutention":"\uD83D\uDCE6","Logistique":"\uD83D\uDE9B","Inventaire":"\uD83D\uDCCB","\u00C9v\u00E9nementiel":"\uD83C\uDFAA","H\u00F4tellerie":"\uD83C\uDFE8","Accueil":"\uD83D\uDC4B"};
const RISK_LEVELS = ["Faible","Moyen","\u00C9lev\u00E9"];
const EQUIP_OPTIONS = ["Casque","Gants","Gilet","Lunettes","Chaussures de s\u00E9curit\u00E9","Tablier","Badge","Polo"];
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0");

// ====== UI COMPONENTS ======
function Card({children,style,onClick}){ return h('div',{onClick,style:{background:C.white,borderRadius:20,padding:16,cursor:onClick?"pointer":"default",boxShadow:"0 1px 4px rgba(0,0,0,0.04)",transition:"all 0.15s",...style}},children); }
function Badge({text,color,bg}){ return h('span',{style:{display:"inline-block",padding:"4px 10px",borderRadius:50,fontSize:11,fontWeight:600,color,background:bg,letterSpacing:0.5}},text); }
function StatCard({emoji,value,label}){ return h('div',{style:{background:C.white,borderRadius:16,padding:"14px 16px",flex:1,textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}, h('div',{style:{fontSize:24}},emoji), h('div',{style:{fontSize:20,fontWeight:800,color:C.text,marginTop:2}},value), h('div',{style:{fontSize:10,fontWeight:600,color:C.textSec,textTransform:"uppercase",letterSpacing:1,marginTop:2}},label)); }
function BackBtn({onClick}){ return h('button',{onClick,style:{background:"none",border:"none",color:C.textSec,fontSize:14,fontWeight:600,cursor:"pointer",padding:"12px 16px"}},"\u2190 Retour"); }
function Btn({children,color,onClick,disabled,full,outline,style:s}){ color=color||C.green; full=full!==false; return h('button',{onClick:disabled?undefined:onClick,style:{width:full?"100%":"auto",padding:"14px 20px",borderRadius:26,background:outline?"transparent":(disabled?C.border:color),color:outline?C.textSec:(disabled?C.textTri:"#fff"),border:outline?"1.5px solid "+C.border:"none",fontSize:15,fontWeight:700,cursor:disabled?"default":"pointer",opacity:disabled?0.6:1,...s}},children); }
function Input({label,emoji,value,onChange,placeholder,multiline,type}){ type=type||"text"; const common={width:"100%",padding:"12px 14px",borderRadius:14,border:"1.5px solid "+C.border,fontSize:14,fontFamily:"inherit",outline:"none",boxSizing:"border-box",background:C.white}; return h('div',{style:{marginBottom:14}}, h('div',{style:{fontSize:12,fontWeight:600,color:C.textSec,marginBottom:6}},emoji+" "+label), multiline?h('textarea',{value,onChange:e=>onChange(e.target.value),placeholder,rows:3,style:{...common,resize:"none"}}):h('input',{type,value,onChange:e=>onChange(e.target.value),placeholder,style:common})); }

    h('div',{style:{padding:"16px 0 20px",display:"flex",flexDirection:"column",alignItems:"center"}},h('div',{style:{width:72,height:72,borderRadius:"50%",background:C.blueLight,display:"flex",alignItems:"center",justifyContent:"center",fontSize:36,marginBottom:12}},"\uD83C\uDFE2"),h('div',{style:{fontSize:20,fontWeight:800,color:C.text}},e.companyName),h(Stars,{rating:e.avgRating})),
    fields.map((f,i)=>h(Card,{key:i,style:{marginBottom:10}},h('div',{style:{display:"flex",alignItems:"center",gap:12}},h('span',{style:{fontSize:20}},f.i),h('div',{style:{flex:1}},h('div',{style:{fontSize:12,fontWeight:600,color:C.textSec,textTransform:"uppercase",letterSpacing:1}},f.l),h('div',{style:{fontSize:14,fontWeight:600,color:C.text,marginTop:2}},f.v||"Non renseign\u00E9"))))),
    h(Btn,{outline:true,onClick:async()=>{await SB.auth.signOut();dispatch({type:"SET_EMPLOYER",payload:null});nav("onboarding");},style:{marginTop:12}},"Se d\u00E9connecter")
  );
}

// ====== OAUTH BUTTONS ======
function OAuthBtn({provider,role,label,icon}){
  const [loading,setLoading]=useState(false);
  const sign=async()=>{
    setLoading(true);
    // Stocker le rôle choisi avant redirect OAuth
    localStorage.setItem('kj_pending_role', role);
    const {error}=await SB.auth.signInWithOAuth({
      provider,
      options:{redirectTo: window.location.href.split('?')[0]}
    });
    if(error){setLoading(false); alert(error.message);}
  };
  return h('button',{onClick:sign,disabled:loading,style:{
    width:"100%",padding:"14px 20px",borderRadius:16,border:"1.5px solid "+C.border,
    background:C.white,display:"flex",alignItems:"center",justifyContent:"center",gap:10,
    fontSize:15,fontWeight:600,color:C.text,cursor:loading?"default":"pointer",
    opacity:loading?0.6:1,marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"
  }},
    loading?h('span',null,"Connexion\u2026"):h(Fragment,null,h('span',{style:{fontSize:20}},icon),h('span',null,label))
  );
}

// ====== CHOIX ROLE APRES OAUTH ======
function RoleChoice({authUser,nav}){
  // L'utilisateur vient de se connecter via OAuth mais n'a pas encore de profil
  const {dispatch}=useContext(AppContext);
  const [role,setRole]=useState(null);
  const [wForm,setWForm]=useState({fullName:authUser.user_metadata?.full_name||"",phone:"",neighborhood:"",skills:[]});
  const [eForm,setEForm]=useState({companyName:"",rccm:"",sector:"",zone:"",phone:""});
  const [saving,setSaving]=useState(false);

  if(!role) return h('div',{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32}},
    h('div',{style:{fontSize:36,fontWeight:800,marginBottom:4}},h('span',{style:{color:C.green}},"Kaza"),h('span',{style:{color:C.blue}},"Job")),
    h('div',{style:{fontSize:13,color:C.textSec,marginBottom:8}},"Bienvenue !"),
    h('div',{style:{fontSize:13,color:C.textSec,marginBottom:32,fontWeight:600}},authUser.email),
    h('div',{style:{fontSize:16,fontWeight:700,color:C.text,marginBottom:20}},"Je suis\u2026"),
    h('button',{onClick:()=>setRole("worker"),style:{width:"100%",padding:"20px",borderRadius:20,border:"2px solid "+C.green,background:C.greenLight,marginBottom:12,cursor:"pointer"}},
      h('div',{style:{fontSize:28,marginBottom:6}},"\uD83D\uDC77\uD83C\uDFFE"),
      h('div',{style:{fontSize:16,fontWeight:800,color:C.greenDark}},"Travailleur"),
      h('div',{style:{fontSize:12,color:C.green,marginTop:4}},"Je cherche des missions")
    ),
    h('button',{onClick:()=>setRole("employer"),style:{width:"100%",padding:"20px",borderRadius:20,border:"2px solid "+C.blue,background:C.blueLight,cursor:"pointer"}},
      h('div',{style:{fontSize:28,marginBottom:6}},"\uD83C\uDFE2"),
      h('div',{style:{fontSize:16,fontWeight:800,color:C.blueDark}},"Employeur"),
      h('div',{style:{fontSize:12,color:C.blue,marginTop:4}},"Je publie des missions")
    )
  );

  if(role==="worker") return h('div',{style:{flex:1,padding:24,overflowY:"auto"}},
    h('button',{onClick:()=>setRole(null),style:{background:"none",border:"none",color:C.textSec,fontSize:14,cursor:"pointer",marginBottom:16}},"\u2190 Retour"),
    h('div',{style:{fontSize:22,fontWeight:800,color:C.text,marginBottom:4}},"Mon profil travailleur"),
    h('div',{style:{fontSize:13,color:C.textSec,marginBottom:20}},"Gratuit \u00B7 Aucun frais"),
    h(Input,{emoji:"\uD83D\uDC64",label:"Nom complet",value:wForm.fullName,onChange:v=>setWForm(p=>({...p,fullName:v})),placeholder:"Votre nom"}),
    h(Input,{emoji:"\uD83D\uDCF1",label:"T\u00E9l\u00E9phone",value:wForm.phone,onChange:v=>setWForm(p=>({...p,phone:v})),placeholder:"077 XX XX XX"}),
    h(Input,{emoji:"\uD83D\uDCCD",label:"Quartier",value:wForm.neighborhood,onChange:v=>setWForm(p=>({...p,neighborhood:v})),placeholder:"Votre quartier \u00E0 Libreville"}),
    h('div',{style:{marginBottom:14}},
      h('div',{style:{fontSize:12,fontWeight:600,color:C.textSec,marginBottom:6}},"\uD83D\uDEE0 Comp\u00E9tences"),
      h('div',{style:{display:"flex",flexWrap:"wrap",gap:6}},CATEGORIES.map(c=>h('button',{key:c,onClick:()=>setWForm(p=>({...p,skills:p.skills.includes(c)?p.skills.filter(x=>x!==c):[...p.skills,c]})),style:{padding:"7px 12px",borderRadius:50,border:"1.5px solid "+(wForm.skills.includes(c)?C.green:C.border),background:wForm.skills.includes(c)?C.greenLight:C.white,color:wForm.skills.includes(c)?C.greenDark:C.textSec,fontSize:12,fontWeight:600,cursor:"pointer"}},(wForm.skills.includes(c)?"\u2713 ":"")+c)))
    ),
    h(Btn,{disabled:!wForm.fullName||!wForm.phone||saving,onClick:async()=>{
      if(!wForm.fullName||!wForm.phone||saving)return;
      setSaving(true);
      await dispatch({type:"REGISTER_WORKER",payload:wForm,authUserId:authUser.id});
      setSaving(false);
      nav("w_home");
    }},saving?"Cr\u00E9ation\u2026":"Commencer \uD83D\uDE80")
  );

  return h('div',{style:{flex:1,padding:24,overflowY:"auto"}},
    h('button',{onClick:()=>setRole(null),style:{background:"none",border:"none",color:C.textSec,fontSize:14,cursor:"pointer",marginBottom:16}},"\u2190 Retour"),
    h('div',{style:{fontSize:22,fontWeight:800,color:C.text,marginBottom:4}},"Mon profil employeur"),
    h('div',{style:{fontSize:13,color:C.textSec,marginBottom:20}},"V\u00E9rification B2B requise"),
    h(Input,{emoji:"\uD83C\uDFE2",label:"Raison sociale",value:eForm.companyName,onChange:v=>setEForm(p=>({...p,companyName:v})),placeholder:"Nom de l'entreprise"}),
    h(Input,{emoji:"\uD83D\uDCC4",label:"RCCM",value:eForm.rccm,onChange:v=>setEForm(p=>({...p,rccm:v})),placeholder:"Num\u00E9ro RCCM"}),
    h(Input,{emoji:"\uD83C\uDFED",label:"Secteur",value:eForm.sector,onChange:v=>setEForm(p=>({...p,sector:v})),placeholder:"Logistique, BTP\u2026"}),
    h(Input,{emoji:"\uD83D\uDCCD",label:"Zone g\u00E9ographique",value:eForm.zone,onChange:v=>setEForm(p=>({...p,zone:v})),placeholder:"Libreville, Owendo\u2026"}),
    h(Input,{emoji:"\uD83D\uDCF1",label:"T\u00E9l\u00E9phone",value:eForm.phone,onChange:v=>setEForm(p=>({...p,phone:v})),placeholder:"077 XX XX XX"}),
    h(Btn,{color:C.blue,disabled:!eForm.companyName||!eForm.rccm||saving,onClick:async()=>{
      if(!eForm.companyName||!eForm.rccm||saving)return;
      setSaving(true);
      await dispatch({type:"REGISTER_EMPLOYER",payload:eForm,authUserId:authUser.id});
      setSaving(false);
      nav("e_home");
    }},saving?"Cr\u00E9ation\u2026":"Cr\u00E9er le compte")
  );
}

// ====== ONBOARDING ======

  // Si l'utilisateur est déjà authentifié via OAuth mais n'a pas de profil → RoleChoice
  if(authUser) return h(RoleChoice,{authUser,nav});

  return h('div',{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32}},
    h('div',{style:{fontSize:42,fontWeight:800,marginBottom:4,letterSpacing:-1}},
      h('span',{style:{color:C.green}},"Kaza"),h('span',{style:{color:"#1D4ED8"}},"Job")
    ),
    h('div',{style:{fontSize:13,color:C.textSec,marginBottom:40}},"Placement rapide s\u00E9curis\u00E9 \u00B7 Libreville"),

    // BLOC TRAVAILLEUR
    h('div',{style:{width:"100%",background:C.greenLight,borderRadius:20,padding:"20px 20px 16px",marginBottom:16,border:"1.5px solid #BBF7D0"}},
      h('div',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:14}},
        h('span',{style:{fontSize:28}},"\uD83D\uDC77\uD83C\uDFFE"),
        h('div',null,
          h('div',{style:{fontSize:16,fontWeight:800,color:C.greenDark}},"Je cherche du travail"),
          h('div',{style:{fontSize:12,color:C.green}},"Inscription gratuite")
        )
      ),
      h(OAuthBtn,{provider:"google",role:"worker",label:"Continuer avec Google",icon:"\uD83D\uDD35"}),
      h(OAuthBtn,{provider:"apple",role:"worker",label:"Continuer avec Apple",icon:"\uD83C\uDF4E"})
    ),

    // BLOC EMPLOYEUR
    h('div',{style:{width:"100%",background:C.blueLight,borderRadius:20,padding:"20px 20px 16px",border:"1.5px solid #BFDBFE"}},
      h('div',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:14}},
        h('span',{style:{fontSize:28}},"\uD83C\uDFE2"),
        h('div',null,
          h('div',{style:{fontSize:16,fontWeight:800,color:C.blueDark}},"Je publie des missions"),
          h('div',{style:{fontSize:12,color:C.blue}},"V\u00E9rification B2B")

// ====== APP ======
const W_NAV=[{id:"w_home",emoji:"\uD83C\uDFE0",label:"Accueil"},{id:"w_search",emoji:"\uD83D\uDD0D",label:"Chercher"},{id:"w_missions",emoji:"\uD83D\uDCCB",label:"Missions"},{id:"w_profile",emoji:"\uD83D\uDC64",label:"Profil"}];
const E_NAV=[{id:"e_home",emoji:"\uD83C\uDFE0",label:"Accueil"},{id:"e_stats",emoji:"\uD83D\uDCCA",label:"Stats"},{id:"e_missions",emoji:"\uD83D\uDCCB",label:"Missions"},{id:"e_account",emoji:"\uD83D\uDC64",label:"Compte"}];
const MAIN_W=["w_home","w_search","w_missions","w_profile"];
const MAIN_E=["e_home","e_stats","e_missions","e_account"];

function App(){
  const appState=useAppState();
  const {state}=appState;
  const [screen,setScreen]=useState("onboarding");
  const [params,setParams]=useState(null);
  const [showInstall,setShowInstall]=useState(false);
  const [authUser,setAuthUser]=useState(null);

  const isW=state.currentWorker&&!state.currentEmployer;
  const isE=state.currentEmployer&&!state.currentWorker;

  const nav=useCallback((s,p)=>{ setParams(p||null); setScreen(s); },[]);

  // Gérer session OAuth Supabase
  useEffect(()=>{
    const checkSession=async()=>{
      const {data:{session}}=await SB.auth.getSession();
      if(!session){setAuthUser(null);return;}
      const user=session.user;
      const {data:profile}=await SB.from('profiles').select('*').eq('id',user.id).maybeSingle();
      if(profile&&profile.entity_id){
        if(profile.role==='worker'){
          const {data:w}=await SB.from('workers').select('*').eq('id',profile.entity_id).single();
          if(w){appState.dispatch({type:'SET_WORKER',payload:w});setAuthUser(null);setScreen('w_home');}
        } else {
          const {data:e}=await SB.from('employers').select('*').eq('id',profile.entity_id).single();
          if(e){appState.dispatch({type:'SET_EMPLOYER',payload:e});setAuthUser(null);setScreen('e_home');}
        }
      } else {
        setAuthUser(user);
        setScreen('onboarding');
      }
    };
    checkSession();
    const {data:{subscription}}=SB.auth.onAuthStateChange((_ev,session)=>{
      if(session) checkSession(); else setAuthUser(null);
    });
    return ()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!state.loading){
      if(state.currentWorker&&screen==="onboarding") setScreen("w_home");
      if(state.currentEmployer&&screen==="onboarding") setScreen("e_home");
    }
  },[state.loading]);

  useEffect(()=>{
    const h=()=>{setShowInstall(true);}; window.addEventListener('kazajob-installable',h); return()=>window.removeEventListener('kazajob-installable',h);
  },[]);

  const render=()=>{
    if(state.loading) return h(LoadingScreen,null);
    switch(screen){
      case "onboarding": return h(Onboarding,{nav,authUser});
      case "w_home": return h(WHome,{nav});
      case "w_search": return h(WSearch,{nav});
      case "w_missions": return h(WMissions,{nav});
      case "w_profile": return h(WProfile,{nav});
      case "w_mission_detail": return h(WMissionDetail,{nav,params});
      case "w_active_mission": return h(WActiveMission,{nav,params});
      case "w_rate": return h(WRate,{nav,params});
      case "e_home": return h(EDash,{nav});
      case "e_stats": return h(EStats,{nav});
      case "e_missions": return h(EMissions,{nav});
      case "e_account": return h(EAccount,{nav});
      case "e_publish": return h(EPublish,{nav});
      case "e_mission_detail": return h(EMissionDetail,{nav,params});
      default: return h(Onboarding,{nav});
    }
  };

  const showNav=(isW&&MAIN_W.includes(screen))||(isE&&MAIN_E.includes(screen));

  return h(AppContext.Provider,{value:appState},
    h('div',{style:{height:"100%",display:"flex",flexDirection:"column",background:C.bg}},
      state.syncing&&h('div',{className:"syncing-bar"}),
      h('div',{style:{flex:1,overflow:"auto",display:"flex",flexDirection:"column"}},render()),
      showNav&&h(BottomNav,{items:isW?W_NAV:E_NAV,active:screen,onNav:nav,accent:isW?C.green:C.blue}),
      showInstall&&h('div',{className:"install-banner"},
        h('div',{style:{width:44,height:44,borderRadius:14,background:C.greenLight,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}},"\uD83D\uDCF2"),
        h('div',{style:{flex:1}},h('div',{style:{fontSize:14,fontWeight:700,color:C.text}},"Installer KazaJob"),h('div',{style:{fontSize:12,color:C.textSec}},"Acc\u00E8s rapide depuis l'\u00E9cran d'accueil")),
        h('button',{onClick:async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;setShowInstall(false);}},style:{padding:"8px 16px",borderRadius:50,background:C.green,color:"#fff",border:"none",fontWeight:700,fontSize:13,cursor:"pointer"}},"Installer"),
        h('button',{onClick:()=>setShowInstall(false),style:{background:"none",border:"none",color:C.textSec,fontSize:18,cursor:"pointer",padding:"4px 8px"}},"\u00D7")
      ),
      state.error&&h('div',{style:{position:"fixed",bottom:showNav?72:12,left:16,right:16,background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:14,padding:"12px 16px",fontSize:13,color:"#991B1B",fontWeight:600,zIndex:200}},"\u26A0\uFE0F "+state.error)
    )
  );
}

ReactDOM.render(h(App,null),document.getElementById('root'));
</script>
</body>
</html>
